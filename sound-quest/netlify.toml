# Netlify: ตั้งค่า Base directory = sound-quest (ถ้า deploy จาก GitHub repo)
# หรือลากโฟลเดอร์ sound-quest ไปวางที่ https://app.netlify.com/drop ได้ทันที
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
